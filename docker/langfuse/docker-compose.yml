# The lab's own Langfuse (LLM observability), separate from any other project on this machine.
# Started from the dashboard (Traces & Monitoring → Langfuse) or:
#   docker compose -p aitrain-langfuse --env-file docker/langfuse/.env -f docker/langfuse/docker-compose.yml up -d
# docker/langfuse/.env is generated with random secrets on first start (lab/langfuse_stack.py) and is git-ignored.
name: aitrain-langfuse

x-langfuse-env: &lf
  DATABASE_URL: postgresql://langfuse:${PG_PASSWORD}@postgres:5432/langfuse
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://objectstore:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://objectstore:9000
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  SALT: ${SALT}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_INIT_ORG_ID: ai-training-lab
  LANGFUSE_INIT_ORG_NAME: AI Training Lab
  LANGFUSE_INIT_PROJECT_ID: ai-training-lab
  LANGFUSE_INIT_PROJECT_NAME: AI Training Lab
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LF_PUBLIC_KEY}
  LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_SECRET_KEY}
  LANGFUSE_INIT_USER_EMAIL: ${LF_USER_EMAIL}
  LANGFUSE_INIT_USER_NAME: lab
  LANGFUSE_INIT_USER_PASSWORD: ${LF_USER_PASSWORD}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_USER: langfuse, POSTGRES_PASSWORD: "${PG_PASSWORD}", POSTGRES_DB: langfuse}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U langfuse"], interval: 3s, retries: 30}
  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    environment: {CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: "${CH_PASSWORD}", CLICKHOUSE_DB: default}
    volumes: [ch:/var/lib/clickhouse]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"], interval: 3s, retries: 40}
  redis:
    image: redis:7.4
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"], interval: 3s, retries: 30}
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
  objectstore:
    image: chrislusf/seaweedfs:3.99
    entrypoint: ["/bin/sh"]
    environment: {S3_SECRET: "${S3_SECRET}"}
    command:
      - -c
      - |
        printf '{"identities":[{"name":"langfuse","credentials":[{"accessKey":"langfuse","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_SECRET" > /tmp/s3.json
        weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0 &
        until echo "s3.bucket.list" | weed shell -master=localhost:9333 >/dev/null 2>&1; do sleep 2; done
        echo "s3.bucket.create -name langfuse" | weed shell -master=localhost:9333 || true
        touch /tmp/ready
        wait
    volumes: [s3:/data]
    healthcheck: {test: ["CMD-SHELL", "test -f /tmp/ready"], interval: 3s, retries: 60}
  langfuse-worker:
    image: langfuse/langfuse-worker:4.64.0
    environment: *lf
    depends_on: &deps
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      objectstore: {condition: service_healthy}
  langfuse-web:
    image: langfuse/langfuse:4.64.0
    environment: *lf
    ports: ["127.0.0.1:${LANGFUSE_PORT}:3000"]
    depends_on: *deps

volumes: {pg: {}, ch: {}, s3: {}}
